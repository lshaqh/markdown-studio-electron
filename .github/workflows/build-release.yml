name: Build & Release (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发布说明来自仓库根的 RELEASE_NOTES.md。
      # 以前用 generate_release_notes: true，因为历史里没有可比对的 tag，
      # 生成出来只有一行 Full Changelog，等于没写。这里改为强制人工维护，
      # 并要求文件开头出现本次 tag，避免说明与版本对不上。
      - name: Verify release notes match tag
        shell: bash
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "release tag: $TAG"
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md 不存在，请先补充发布说明"
            exit 1
          fi
          if ! head -n 3 RELEASE_NOTES.md | grep -qF "$TAG"; then
            echo "::error::RELEASE_NOTES.md 开头未出现 $TAG，请先把发布说明更新为本次版本"
            exit 1
          fi
          echo "release notes ok"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers (NSIS + Portable)
        run: npm run dist -- --publish never

      - name: List artifacts
        run: dir release

      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Markdown Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
